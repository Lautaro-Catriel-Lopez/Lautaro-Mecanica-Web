function pl(){const d=draft,H=d.tarifas.hora||0,t=($('#pq').value||'').toLowerCase();
$('#pl').innerHTML=d.servicios.filter(v=>!v.n||!t||(v.n+' '+v.r).toLowerCase().includes(t)).map(v=>`<div class="pr" data-id="${v.id}"><label class="n">Servicio<input data-f="n" value="${esc(v.n)}" placeholder="Nombre del servicio"></label><label>Rubro<input data-f="r" list="dl" value="${esc(v.r)}"></label><label>Horas<input data-f="h" type="number" step="0.01" min="0" value="${v.h}"></label><label>Precio $<input data-f="p" type="number" step="100" min="0" value="${Math.round(v.h*H)}"></label><label>Motor<select data-f="m">${[['','Todos'],['8v','Nafta 8v'],['16v','Nafta 16v'],['D','Diésel'],['8v,16v','Nafta 8v y 16v'],['16v,D','16v y Diésel']].map(o=>`<option value="${o[0]}"${(v.m||'')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label><button class="btn g" data-del="${v.id}" aria-label="Eliminar">✕</button></div>`).join('');
$('#pl').onchange=e=>{const i=e.target,r=i.closest('.pr');if(!r||!i.dataset.f)return;const v=d.servicios.find(x=>x.id==r.dataset.id),k=i.dataset.f,val=parseFloat(i.value)||0;
if(k==='h'){v.h=val;r.querySelector('[data-f=p]').value=Math.round(v.h*H)}else if(k==='p'){v.h=H?Math.round(val/H*1000)/1000:0;r.querySelector('[data-f=h]').value=v.h}else v[k]=i.value};
$('#pl').onclick=e=>{const b=e.target.closest('[data-del]');if(b){d.servicios=d.servicios.filter(x=>x.id!=b.dataset.del);pl()}}}
function note(t){$('#pm').innerHTML=`<div class="msg">${esc(t)}</div>`}
async function save(){const d=draft;d.servicios=d.servicios.filter(x=>x.n.trim());if(d.rT!=null){d.taller.resenas=d.taller.resenas||{};d.taller.resenas.items=d.rT.split('\n').map(l=>l.split('|')).filter(p=>p[0].trim()&&p[1]&&p[1].trim()).map(p=>({n:p[0].trim(),t:p.slice(1).join('|').trim()}));delete d.rT}
try{const c=window.claude&&await claude.use('artifact');if(c){await c.publish(buildDoc(d));return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildDoc(d)],{type:'text/html'}));a.download='index.html';a.click();note('Se descargó el archivo actualizado. Subilo a tu hosting para publicar los cambios.')}
catch(e){note(e.code==='conflict'?'Se publicó otro cambio antes que el tuyo. Recargá la página y repetí la edición.':(e.code==='not_writer'||e.code==='not_granted')?'No tenés permiso para publicar cambios en esta página.':'No se pudo guardar: '+(e.message||e.code))}}
main()})();
</script><script id="vd" type="text/plain"></script></body></html>
